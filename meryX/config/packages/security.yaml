security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserLoginChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: App\Security\Authentication\LoginSuccessHandler
                failure_handler: App\Security\Authentication\LoginFailureHandler

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserLoginChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/candidatures, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/savedOpportunities, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/companyPosts$, methods: [POST], roles: ROLE_COMPANY }
        - { path: ^/api/opportunities$, methods: [POST], roles: ROLE_COMPANY }
        - { path: ^/api/trainings$, methods: [POST], roles: ROLE_COMPANY }
        - { path: ^/api/conversations, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/api/messages, roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_UNIVERSITY, ROLE_STUDENT, ROLE_COMPANY]
